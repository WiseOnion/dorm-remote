name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          phones = [d for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project DormRemote.xcodeproj \
            -scheme DormRemote \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test.log | grep -E "Test Case|error:|failed|passed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-log
          path: test.log
          retention-days: 3
