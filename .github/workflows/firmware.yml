name: Build firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18 esptool==4.8.1
      - name: Build
        run: pio run -d firmware
      - name: Merge into one flashable image
        run: |
          B=firmware/.pio/build/atom
          BOOT=$(find ~/.platformio/packages/framework-arduinoespressif32/tools/partitions -name boot_app0.bin | head -1)
          python -m esptool --chip esp32 merge_bin -o dormbridge-merged.bin \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT" 0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v6
        with:
          name: dormbridge-firmware
          path: dormbridge-merged.bin
          if-no-files-found: error
