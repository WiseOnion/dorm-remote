name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project DormRemote.xcodeproj \
            -scheme DormRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DormRemote.app Payload/
          zip -qry DormRemote-unsigned.ipa Payload

      - uses: actions/upload-artifact@v6
        with:
          name: DormRemote-unsigned-ipa
          path: DormRemote-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
