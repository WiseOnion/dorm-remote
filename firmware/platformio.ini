; Dorm Remote IR bridge for an M5Stack ATOM Lite (ESP32-PICO, built-in IR LED).
; Build: pio run   Flash: see firmware/README.md (browser flasher, no install).
[env:atom]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@2.3.2
  crankyoldgit/IRremoteESP8266@2.8.6
